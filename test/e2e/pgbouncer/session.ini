[databases]
tenancy_test = host=postgres port=5432 dbname=tenancy_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = tenancy
stats_users = tenancy
pool_mode = session
default_pool_size = 1
max_db_connections = 1
max_prepared_statements = 200
query_wait_timeout = 1
