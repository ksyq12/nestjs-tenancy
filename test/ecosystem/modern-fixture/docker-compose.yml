services:
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    ports:
      - target: 5432
        published: 0
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      POSTGRES_USER: tenancy
      POSTGRES_PASSWORD: tenancy
      POSTGRES_DB: tenancy_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenancy"]
      interval: 2s
      timeout: 5s
      retries: 10
