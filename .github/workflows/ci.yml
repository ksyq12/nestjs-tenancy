name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.19.0, 22, 24]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run build

      - name: Upload coverage to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          fail_ci_if_error: false

  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - nest: 10
            prisma: 6
            node: 20.19.0
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - name: Override to Nest ${{ matrix.nest }} + Prisma ${{ matrix.prisma }}
        run: npm install @nestjs/common@${{ matrix.nest }} @nestjs/core@${{ matrix.nest }} @nestjs/testing@${{ matrix.nest }} @nestjs/platform-express@${{ matrix.nest }} @prisma/client@${{ matrix.prisma }} --no-save
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tenancy
          POSTGRES_PASSWORD: tenancy
          POSTGRES_DB: tenancy_test
        ports:
          - 5433:5432
        options: --health-cmd "pg_isready -U tenancy" --health-interval 2s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate --schema=test/e2e/schema.prisma
        env:
          DATABASE_URL: postgresql://tenancy:tenancy@localhost:5433/tenancy_test
      - run: npx jest --config test/e2e/jest.e2e.config.ts --runInBand
        env:
          DATABASE_URL: postgresql://tenancy:tenancy@localhost:5433/tenancy_test
          APP_DATABASE_URL: postgresql://app_user:app_user@localhost:5433/tenancy_test

  pgbouncer-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prisma: ['6.19.3', '7.9.1']

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Install Prisma ${{ matrix.prisma }} E2E runtime
        run: npm install prisma@${{ matrix.prisma }} @prisma/client@${{ matrix.prisma }} @prisma/adapter-pg@${{ matrix.prisma }} --no-save
      - run: npm run test:e2e:pgbouncer

  redis-e2e:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.10-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx jest --config test/e2e/redis/jest.redis.config.ts --runInBand
        env:
          REDIS_URL: redis://127.0.0.1:6380
